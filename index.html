<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
<meta name="apple-mobile-web-app-title" content="Jeffrey's Weekly List" />
<title>Jeffrey's Weekly List</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<link rel="icon" href="icon.png" type="image/png" sizes="32x32" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  /* ============================================================
     Apple-native visual pass. Class names and DOM unchanged.
     ============================================================ */
  :root {
    --tint: #D85A30;
    --work: #007AFF;
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --sep: rgba(60,60,67,0.22);
    --label: #000000;
    --label2: rgba(60,60,67,0.60);
    --label3: rgba(60,60,67,0.32);
    --fill: rgba(120,120,128,0.12);
    --blur-bg: rgba(242,242,247,0.82);
    --danger: #FF3B30;
    /* legacy aliases kept so any stray rule or inline style still resolves */
    --orange: var(--tint);
    --border: var(--sep);
    --border-strong: var(--sep);
    --text: var(--label);
    --text-muted: var(--label2);
    --text-faint: var(--label3);
    --check-border: var(--label3);
    --work-bg: rgba(0,122,255,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tint: #FF7A4D;
      --work: #0A84FF;
      --bg: #000000;
      --surface: #1C1C1E;
      --sep: rgba(84,84,88,0.65);
      --label: #FFFFFF;
      --label2: rgba(235,235,245,0.60);
      --label3: rgba(235,235,245,0.30);
      --fill: rgba(120,120,128,0.24);
      --blur-bg: rgba(0,0,0,0.72);
      --danger: #FF453A;
      --work-bg: rgba(10,132,255,0.16);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--label); min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 520px; margin: 0 auto; padding: 0 16px calc(48px + env(safe-area-inset-bottom)); }

  /* ---------- header: large title + quiet toolbar, sticky and translucent ---------- */
  .app-header {
    position: sticky; top: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: stretch;
    margin: 0 -16px 14px; padding: calc(16px + env(safe-area-inset-top)) 16px 8px;
    background: var(--blur-bg);
  }
  @supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .app-header { -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }
  }
  .app-logo { display: none; }
  .week-label {
    font-size: 28px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.15;
    text-transform: none; color: var(--label); margin-bottom: 1px;
  }
  .week-range { font-size: 15px; letter-spacing: -0.01em; color: var(--label2); }
  .header-actions {
    display: flex; gap: 2px; align-items: center; flex-wrap: wrap;
    justify-content: flex-start; margin: 10px -6px 0;
  }
  .hbtn {
    background: none; border: none; border-radius: 8px;
    padding: 0 6px; height: 30px; cursor: pointer;
    color: var(--label2); font-size: 15px; letter-spacing: -0.01em;
    font-family: inherit; display: flex; align-items: center; gap: 5px;
    transition: opacity .12s;
  }
  .hbtn i { font-size: 17px; }
  .hbtn:active { opacity: .45; }
  .hbtn.orange { color: var(--tint); }
  .hbtn.active-work { color: var(--work); background: none; border: none; }
  .hbtn.active-personal { color: var(--tint); background: none; border: none; }
  #account-btn { margin-left: auto; }

  .status-bar {
    font-size: 13px; color: var(--label2); padding: 0 0 10px;
    display: flex; align-items: center; gap: 6px; min-height: 20px;
    letter-spacing: -0.01em;
  }
  .progress-wrap { height: 3px; background: var(--fill); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--tint); border-radius: 2px; transition: width .4s; }
  .spin { display: inline-block; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- grouped inset day lists ---------- */
  .day-block { margin-bottom: 22px; padding-bottom: 0; border-top: none; }
  .day-header-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 0 4px 7px; cursor: pointer; user-select: none;
  }
  .day-header-row > div:first-child { display: flex; align-items: baseline; gap: 7px; }
  .day-title {
    font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    text-transform: none; color: var(--label); line-height: 1.2;
  }
  .day-title.today { color: var(--tint); }
  .day-meta { font-size: 15px; letter-spacing: -0.01em; color: var(--label2); margin-top: 0; }
  .day-header-right { display: flex; align-items: center; gap: 7px; }
  .day-count { font-size: 15px; color: var(--label3); }
  .chevron { font-size: 13px; color: var(--label3); transition: transform .2s; display: inline-block; }
  .chevron.open { transform: rotate(180deg); }
  .day-body {
    background: var(--surface); border-radius: 12px; padding-bottom: 0;
    transition: background .15s;
  }
  /* Rows are opaque now (they slide over the swipe actions), so the drag-over
     state uses an outer ring rather than a background tint the rows would hide. */
  .day-body.drag-over { box-shadow: 0 0 0 2px var(--tint); }

  /* ---------- task rows ---------- */
  .task-row {
    position: relative; display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; min-height: 46px;
    border: none; margin-left: 0; border-radius: 0;
    user-select: none; cursor: grab;
    background: var(--surface); position: relative; z-index: 1;
    transition: transform .25s cubic-bezier(.32,.72,0,1);
  }
  .task-row.swiping { transition: none; }
  .task-swipe + .task-swipe .task-row::before, .add-row::before {
    content: ''; position: absolute; left: 50px; right: 0; top: 0;
    height: 0.5px; background: var(--sep);
  }
  .task-swipe { position: relative; overflow: hidden; }
  .task-swipe:first-child { border-radius: 12px 12px 0 0; }
  .swipe-actions { position: absolute; inset: 0 0 0 auto; display: flex; }
  .swipe-actions button {
    width: 75px; border: none; cursor: pointer; color: #fff;
    font-family: inherit; font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  .swipe-actions button i { font-size: 20px; }
  .swipe-actions .sa-flag { background: var(--tint); }
  .swipe-actions .sa-del { background: var(--danger); }
  .swipe-actions button:active { filter: brightness(.88); }
  /* Touch devices reveal delete on swipe, so the always-visible X is redundant. */
  @media (hover: none) { .task-del { display: none; } }
  .task-row.dragging { opacity: .4; cursor: grabbing; }
  .task-row.drop-before { box-shadow: inset 0 2px 0 var(--tint); }
  .task-row.drop-after  { box-shadow: inset 0 -2px 0 var(--tint); }
  .task-row.cat-work { border-left: none; }

  .check-box {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--label3); flex-shrink: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: none; transition: background .12s, border-color .12s; order: 0;
  }
  .check-box.checked { background: var(--tint); border-color: var(--tint); }
  .check-box.cal {
    border-color: transparent; background: none; color: var(--label2);
  }
  .check-box.cal::before {
    content: ''; width: 17px; height: 17px; background: var(--label2);
    -webkit-mask: var(--icon-cal) center / contain no-repeat;
            mask: var(--icon-cal) center / contain no-repeat;
  }
  @keyframes check-pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 70% { transform: scale(.9); } 100% { transform: scale(1); } }
  .check-box.pop { animation: check-pop .3s cubic-bezier(.36,.07,.19,.97); }

  .task-label {
    flex: 1; order: 1; font-size: 17px; letter-spacing: -0.02em;
    color: var(--label); line-height: 1.25; cursor: inherit;
  }
  .task-label.done { text-decoration: none; color: var(--label3); }

  .task-edit-input {
    flex: 1; order: 1; font-size: 17px; font-family: inherit; color: var(--label);
    background: var(--fill); border: none; border-radius: 8px;
    padding: 4px 8px; outline: none; line-height: 1.25; letter-spacing: -0.02em;
  }

  /* Priority: high renders as a flag at the trailing edge; med and low sort only. */
  .pri-dot {
    order: 2; flex-shrink: 0; width: 15px; height: 15px; border-radius: 0;
    background: var(--tint);
    -webkit-mask: var(--icon-flag) center / contain no-repeat;
            mask: var(--icon-flag) center / contain no-repeat;
  }
  .p-med, .p-low { display: none; }
  .task-row .task-label.done ~ .pri-dot { opacity: .35; }

  .task-time { order: 3; font-size: 15px; letter-spacing: -0.01em; color: var(--label2); font-weight: 400; flex-shrink: 0; }
  .cal-badge { display: none; }
  .work-badge {
    order: 3; font-size: 15px; letter-spacing: -0.01em; font-weight: 400;
    color: var(--work); flex-shrink: 0;
    text-transform: lowercase; display: inline-block;
  }
  .work-badge::first-letter { text-transform: uppercase; }
  .task-del {
    order: 4; background: none; border: none; cursor: pointer;
    color: var(--label3); font-size: 15px; padding: 4px; opacity: .5; flex-shrink: 0;
  }

  /* ---------- add row ---------- */
  .add-row { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 46px; }
  .add-row input {
    flex: 1; order: 1; border: none; background: none; font-size: 17px;
    font-family: inherit; color: var(--label); outline: none; padding: 0; letter-spacing: -0.02em;
  }
  .add-row input::placeholder { color: var(--label3); }
  .add-row-btn {
    order: -1; background: none; border: none; cursor: pointer; color: var(--tint);
    font-size: 22px; line-height: 1; padding: 0; flex-shrink: 0;
    width: 22px; display: flex; align-items: center; justify-content: center;
  }
  .add-row .cat-toggle { order: 3; }
  .flag-btn {
    order: 2; background: none; border: none; cursor: pointer; padding: 0 2px;
    flex-shrink: 0; color: var(--label3); font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: color .12s, opacity .12s;
  }
  .flag-btn.on { color: var(--tint); }
  .flag-btn:active { opacity: .5; }

  /* ---------- segmented control ---------- */
  .cat-toggle {
    display: flex; border-radius: 7px; overflow: hidden; border: none;
    background: var(--fill); padding: 2px; flex-shrink: 0;
  }
  .cat-toggle button {
    background: none; border: none; cursor: pointer; font-size: 13px;
    font-family: inherit; font-weight: 500; padding: 3px 9px;
    color: var(--label2); border-radius: 5px; line-height: 1.3;
    transition: background .12s, color .12s;
    text-transform: lowercase; display: inline-block;
  }
  .cat-toggle button::first-letter { text-transform: uppercase; }
  .cat-toggle button.sel-personal, .cat-toggle button.sel-work {
    background: var(--surface); color: var(--label); font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,.14);
  }

  .footer-note { font-size: 13px; color: var(--label3); text-align: center; padding: 20px 0 0; letter-spacing: -0.01em; }

  /* ---------- drag ghost ---------- */
  .touch-drag-ghost {
    position: fixed; pointer-events: none; z-index: 9999;
    background: var(--surface); border: none; border-radius: 12px;
    padding: 12px 16px; font-size: 17px; font-family: inherit; color: var(--label);
    box-shadow: 0 12px 32px rgba(0,0,0,.22); max-width: 280px; opacity: .96;
    transform: scale(1.03); transition: transform .1s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.02em;
  }

  /* ---------- modals presented as bottom sheets ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; padding: 0;
  }
  .modal {
    position: relative; background: var(--surface);
    border-radius: 14px 14px 0 0; padding: 26px 20px calc(20px + env(safe-area-inset-bottom));
    max-width: 520px; width: 100%; max-height: 86vh; overflow-y: auto;
    animation: sheet-up .34s cubic-bezier(.32,.72,0,1);
  }
  .modal::before {
    content: ''; position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    width: 36px; height: 5px; border-radius: 3px; background: var(--label3);
  }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
  .modal h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 3px; }
  .modal p { font-size: 15px; color: var(--label2); margin-bottom: 18px; letter-spacing: -0.01em; }
  .modal-task {
    position: relative; display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: none; font-size: 17px; letter-spacing: -0.02em;
  }
  .modal-task + .modal-task::before {
    content: ''; position: absolute; left: 38px; right: 0; top: 0; height: .5px; background: var(--sep);
  }
  .modal-day-label {
    font-size: 13px; font-weight: 600; color: var(--label3);
    text-transform: none; letter-spacing: 0; flex-shrink: 0; width: 30px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-btn {
    flex: 1; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    font-family: inherit; font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
    transition: opacity .15s;
  }
  .modal-btn.primary { background: var(--tint); color: #fff; }
  .modal-btn.secondary { background: var(--fill); color: var(--label); }
  .modal-btn:hover { opacity: .85; }
  .modal-btn:active { opacity: .6; }
  .archive-empty { font-size: 15px; color: var(--label3); padding: 16px 0; text-align: center; }
  .archive-date { font-size: 15px; color: var(--label3); flex-shrink: 0; margin-left: auto; padding-left: 8px; }
  .modal-task.done span:not(.modal-day-label):not(.archive-date) { text-decoration: none; color: var(--label3); }

  /* inline SVG masks used above */
  :root {
    --icon-flag: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="black"><path d="M5 3a1 1 0 0 1 1 1v.5l2.6-.7a7 7 0 0 1 4.6.4 7 7 0 0 0 4.6.4l1.9-.5A1 1 0 0 1 21 5.1v8.2a1 1 0 0 1-.75.97l-2.2.55a7 7 0 0 1-4.6-.4 7 7 0 0 0-4.6-.4L6 14.7V21a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1z"/></svg>');
    --icon-cal: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>');
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="icon.png" class="app-logo" alt="Jeffrey's Weekly List" onerror="this.style.display='none'" />
      <div>
        <div class="week-label">Jeffrey's Weekly List</div>
        <div class="week-range" id="week-range"></div>
      </div>
    </div>
    <div class="header-actions">
      <button class="hbtn" id="filter-btn"><i class="ti ti-filter"></i> All</button>
      <button class="hbtn" id="sort-btn"><i class="ti ti-arrow-up-down"></i> Sort</button>
      <button class="hbtn orange" id="cal-btn"><i class="ti ti-calendar"></i> <span id="cal-btn-label">Connect cal</span></button>
      <button class="hbtn" id="account-btn" style="display:none" title="Account"><i class="ti ti-user"></i></button>
    </div>
  </div>

  <div class="status-bar" id="status-bar"></div>
  <div class="progress-wrap"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div id="days-container"></div>
  <div class="footer-note">Plan less, do more.</div>
</div>

<div class="modal-overlay" id="reset-modal" style="display:none">
  <div class="modal">
    <h2>New week!</h2>
    <p>You have unfinished tasks from last week. What would you like to do?</p>
    <div id="modal-task-list"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="modal-fresh">Start fresh</button>
      <button class="modal-btn primary" id="modal-carry">Carry all over</button>
    </div>
  </div>
</div>

<style>
  .auth-gate {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); padding: 24px;
  }
  .auth-card {
    background: var(--surface); border: none;
    border-radius: 16px; padding: 34px 26px 26px; width: 100%; max-width: 340px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.10);
  }
  .auth-logo { width: 60px; height: 60px; border-radius: 14px; margin-bottom: 16px; }
  .auth-card h2 { margin: 0 0 5px; font-size: 22px; color: var(--label); font-weight: 700; letter-spacing: -0.02em; }
  .auth-card p { margin: 0 0 22px; font-size: 15px; color: var(--label2); letter-spacing: -0.01em; line-height: 1.35; }
  .auth-google-btn {
    width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 16px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; cursor: pointer;
    color: #fff; background: var(--tint); border: none; border-radius: 12px;
    font-family: inherit; transition: opacity .15s;
  }
  .auth-google-btn:hover { opacity: .92; }
  .auth-google-btn:active { opacity: .7; }
  .auth-google-btn:disabled { opacity: .45; cursor: default; }
  .auth-status { margin-top: 14px; min-height: 18px; font-size: 15px; color: var(--label2); letter-spacing: -0.01em; }
  .auth-status.err { color: var(--danger); }
</style>

<div class="auth-gate" id="auth-gate">
  <div class="auth-card">
    <img src="icon.png" class="auth-logo" alt="" onerror="this.style.display='none'" />
    <h2>Jeffrey's Weekly List</h2>
    <p>Sign in to load and sync your tasks across devices.</p>
    <button class="auth-google-btn" id="signin-btn"><i class="ti ti-brand-google"></i> Sign in with Google</button>
    <div class="auth-status" id="auth-status"></div>
  </div>
</div>

<div class="modal-overlay" id="account-modal" style="display:none">
  <div class="modal">
    <h2>Account</h2>
    <p id="account-email" style="word-break:break-all;margin:0 0 4px"></p>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="archive-btn">Archive history</button>
      <button class="modal-btn secondary" id="clear-btn">Clear completed</button>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" id="signout-btn">Sign out</button>
      <button class="modal-btn primary" id="account-close-btn">Close</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="archive-modal" style="display:none">
  <div class="modal">
    <h2>Archive history</h2>
    <p>Completed tasks from past weeks, newest first.</p>
    <div id="archive-list"><div class="archive-empty">Loading…</div></div>
    <div class="modal-actions">
      <button class="modal-btn primary" id="archive-close-btn">Close</button>
    </div>
  </div>
</div>

const TODAY = new Date();

function getMonWeek(fromDate) {
  const d = fromDate || TODAY;
  const diff = d.getDay() === 0 ? -6 : 1 - d.getDay();
  return Array.from({length: 7}, (_, i) => {
    const dt = new Date(d);
    dt.setDate(d.getDate() + diff + i);
    return dt;
  });
}

const WEEK = getMonWeek();
const todayKey = dateKey(TODAY);
const todayColIdx = WEEK.findIndex(d => dateKey(d) === todayKey);
const weekStartKey = dateKey(WEEK[0]);

document.getElementById('week-range').textContent = (() => {
  const s = WEEK[0], e = WEEK[6];
  const mo = d => d.toLocaleDateString('en-US', {month: 'short'});
  return `${mo(s)} ${s.getDate()} - ${mo(e)} ${e.getDate()}, ${e.getFullYear()}`;
})();

// ── Flag ─────────────────────────────────────────────────────────────────────
// Priority collapsed to a single flagged on/off state. The stored field is still
// `priority`; 'high' means flagged and anything else (including legacy 'med' and
// 'low') means not flagged. No migration needed.
function isFlagged(t) { return t.priority === 'high'; }
function flagValue(on) { return on ? 'high' : 'none'; }

// ── Auto-collapse: past days start collapsed, today + future start open ───────
// NOTE: in this map, `true` = OPEN. Today and future days start open;

const collapsed = Object.fromEntries(
  WEEK.map((_, i) => [i, i >= todayColIdx])
);

// ── Utilities ─────────────────────────────────────────────────────────────────
function setStatus(msg, spin) {
  const el = document.getElementById('status-bar');
  el.innerHTML = spin ? `<i class="ti ti-refresh spin"></i> ${msg}` : msg;
}

function fmtTime(iso) {
  if (!iso || iso.length === 10) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  let h = d.getHours(), m = d.getMinutes();
  const ap = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return m ? `${h}:${String(m).padStart(2,'0')}${ap}` : `${h}${ap}`;
}

function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ── Firebase helpers ──────────────────────────────────────────────────────────
async function saveTask(task) {
  suppressSnapshot = true;
  try { await setDoc(doc(db, 'tasks', String(task.id)), { ...task, weekStart: weekStartKey }); }
  catch(e) { console.error('Save failed', e); }
  finally { setTimeout(() => { suppressSnapshot = false; }, 300); }
}

// Optimistically add a new task to the UI, then persist.
// Mirrors the drag-drop pattern: update in-memory tasks + render() directly,
// because saveTask() suppresses the Firestore snapshot echo that would
// otherwise be responsible for drawing the new task.
// Next manual-order value for a day (max existing + 1), so new tasks land at the bottom.
function nextOrderForDay(di) {
  const orders = tasks
    .filter(t => t.day === di && !t.isCal && (!t.weekStart || t.weekStart >= weekStartKey) && typeof t.order === 'number')
    .map(t => t.order);
  return orders.length ? Math.max(...orders) + 1 : 0;
}

function commitNewTask(task) {
  task.weekStart = weekStartKey;   // match what saveTask persists so the week filter includes it
  if (task.order == null) task.order = nextOrderForDay(task.day); // append at bottom in manual order
  tasks.push(task);                // optimistic in-memory insert
  render();                        // draw immediately
  saveTask(task);                  // persist; snapshot echo is suppressed
}

async function removeTask(id) {
  try { await deleteDoc(doc(db, 'tasks', String(id))); }
  catch(e) { console.error('Delete failed', e); }
}

async function archiveTask(task) {
  try {
    await addDoc(archiveCol, { ...task, archivedAt: new Date().toISOString() });
    await deleteDoc(doc(db, 'tasks', String(task.id)));
  } catch(e) { console.error('Archive failed', e); }
}

// ── Week reset modal ──────────────────────────────────────────────────────────
async function handleWeekReset(oldTasks) {
  const lastResetWeek = localStorage.getItem(RESET_KEY);
  if (lastResetWeek === weekStartKey) return;
  if (oldTasks.length === 0) { localStorage.setItem(RESET_KEY, weekStartKey); return; }

  const modal = document.getElementById('reset-modal');
  const taskList = document.getElementById('modal-task-list');
  taskList.innerHTML = oldTasks.map(t =>
    `<div class="modal-task"><span class="modal-day-label">${DAY_SHORT[t.day]}</span><span style="flex:1">${escapeHtml(t.text)}</span></div>`
  ).join('');
  modal.style.display = 'flex';

  document.getElementById('modal-carry').onclick = async () => {
    modal.style.display = 'none';
    localStorage.setItem(RESET_KEY, weekStartKey);
    for (const t of oldTasks) {
      const newTaskId = newId();
      await setDoc(doc(db, 'tasks', String(newTaskId)), { ...t, id: newTaskId, weekStart: weekStartKey, done: false });
      await archiveTask(t);
    }
  };

  document.getElementById('modal-fresh').onclick = async () => {
    modal.style.display = 'none';
    localStorage.setItem(RESET_KEY, weekStartKey);
    for (const t of oldTasks) await archiveTask(t);
  };
}

// ── Firebase real-time sync ───────────────────────────────────────────────────
const _onTasksSnapshot = async (snapshot) => {
  tasks = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));

  for (const t of tasks.filter(t => t.weekStart && t.weekStart < weekStartKey && t.done)) {
    await archiveTask(t);
  }

  if (!resetHandled) {
    resetHandled = true;
    await handleWeekReset(tasks.filter(t => t.weekStart && t.weekStart < weekStartKey && !t.done));
  }

  setStatus('', false);
  if (!suppressSnapshot) render();

  if (!hasScrolledToToday && todayColIdx >= 0) {
    hasScrolledToToday = true;
    setTimeout(() => {
      document.querySelectorAll('.day-block')[todayColIdx]?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 300);
  }
};

const _onTasksError = (err) => {
  if (err && err.code === 'permission-denied') {
    setStatus('Access denied — check Firestore rules or sign-in', false);
  } else {
    setStatus('Sync error - check connection', false);
  }
};

let firestoreStarted = false;
function startFirestoreSync() {
  if (firestoreStarted) return;
  firestoreStarted = true;
  setStatus('Connecting...', true);
  onSnapshot(query(tasksCol), _onTasksSnapshot, _onTasksError);
}

// ── Touch drag helpers ────────────────────────────────────────────────────────
function createGhost(text) {
  const ghost = document.createElement('div');
  ghost.className = 'touch-drag-ghost';
  ghost.textContent = text;
  document.body.appendChild(ghost);
  return ghost;
}

function moveGhost(x, y) {
  if (!touchGhost) return;
  touchGhost.style.left = (x - 20) + 'px';
  touchGhost.style.top  = (y - 30) + 'px';
}

function clearGhost() {
  touchGhost?.remove();
  touchGhost = null;
}

function clearHighlight() {
  if (lastHighlightedBody) {
    lastHighlightedBody.classList.remove('drag-over');
    lastHighlightedBody = null;
  }
}

function getDayBodyAtPoint(x, y) {
  if (touchGhost) touchGhost.style.display = 'none';
  const el = document.elementFromPoint(x, y);
  if (touchGhost) touchGhost.style.display = '';
  const body = el?.closest('.day-body');
  if (!body) return null;
  const idx = parseInt(body.dataset.dayIdx);
  return isNaN(idx) ? null : { body, idx };
}

function cancelTouchDrag() {
  clearTimeout(touchLongPressTimer);
  touchLongPressTimer = null;
  touchDragging = false;
  touchDragId = null;
  clearGhost();
  clearHighlight();
  clearInsertion();
  document.querySelectorAll('.task-row.dragging').forEach(r => r.classList.remove('dragging'));
}

// ── Reorder-within-a-day helpers ──────────────────────────────────────────────
// Among the user-task rows in `body`, return the id of the row to insert BEFORE
// based on pointer Y (cursor above a row's midpoint). null = append at the end.
function insertBeforeIdAt(body, clientY, draggedId) {
  const rows = [...body.querySelectorAll('.task-row')]
    .filter(r => r.dataset.cal !== '1' && r.dataset.taskId !== String(draggedId));
  for (const r of rows) {
    const rect = r.getBoundingClientRect();
    if (clientY < rect.top + rect.height / 2) return r.dataset.taskId;
  }
  return null;
}

function clearInsertion() {
  document.querySelectorAll('.task-row.drop-before, .task-row.drop-after')
    .forEach(r => r.classList.remove('drop-before', 'drop-after'));
}

// Paint the drop indicator (manual-order mode only — sorted modes have no manual slot).
function markInsertion(body, clientY, draggedId) {
  clearInsertion();
  if (sortMode !== 'none') return;
  const beforeId = insertBeforeIdAt(body, clientY, draggedId);
  if (beforeId != null) {
    body.querySelector(`.task-row[data-task-id="${CSS.escape(beforeId)}"]`)?.classList.add('drop-before');
  } else {
    const rows = [...body.querySelectorAll('.task-row')].filter(r => r.dataset.cal !== '1');
    rows[rows.length - 1]?.classList.add('drop-after');
  }
}

// Move a task to targetDay, inserting before beforeId (null = append). Renumbers that
// day's user tasks so manual order persists, and writes only the tasks that changed.
function moveTaskTo(taskId, targetDay, beforeId) {
  const moved = tasks.find(x => String(x.id) === String(taskId));
  if (!moved || moved.isCal) return;

  moved.day = targetDay;
  if (moved.weekStart == null) moved.weekStart = weekStartKey; // keep it inside the week filter

  let dayList = tasks
    .filter(t => t.day === targetDay && !t.isCal
              && (!t.weekStart || t.weekStart >= weekStartKey)
              && String(t.id) !== String(taskId))
    .sort((a, b) => (a.order ?? Infinity) - (b.order ?? Infinity));

  let idx = dayList.length;
  if (beforeId != null) {
    const bi = dayList.findIndex(t => String(t.id) === String(beforeId));
    if (bi !== -1) idx = bi;
  }
  dayList.splice(idx, 0, moved);

  const changed = [];
  dayList.forEach((t, i) => { if (t.order !== i) { t.order = i; changed.push(t); } });

  render();                 // reflect immediately from in-memory tasks
  changed.forEach(saveTask); // persist; snapshot echoes are suppressed
}

// Single entry point for both desktop and touch drops.
function handleDrop(id, body, clientY) {
  const targetDay = parseInt(body.dataset.dayIdx);
  const moved = tasks.find(x => String(x.id) === String(id));
  if (!moved || moved.isCal || isNaN(targetDay)) return;
  if (sortMode === 'none') {
    moveTaskTo(id, targetDay, insertBeforeIdAt(body, clientY, id)); // reorder within / across days
  } else if (moved.day !== targetDay) {
    moveTaskTo(id, targetDay, null); // sorted modes: cross-day move only, append at bottom
  }
}

// ── Google Calendar ───────────────────────────────────────────────────────────
function updateCalBtn() {
  document.getElementById('cal-btn-label').textContent = accessToken ? 'Sync cal' : 'Connect cal';
}

async function fetchCalendar(force) {
  if (!accessToken) return;
  const todStr = dateKey(TODAY);
  const cached = localStorage.getItem(CK);
  const cachedD = localStorage.getItem(DK);
  if (!force && cached && cachedD === todStr) {
    try { return JSON.parse(cached); } catch(e) {}
  }
  setStatus('Syncing calendar...', true);

  const pad = n => String(n).padStart(2, '0');
  const tzOff = WEEK[0].getTimezoneOffset();
  const tzSign = tzOff <= 0 ? '+' : '-';
  const tzStr = `${tzSign}${pad(Math.floor(Math.abs(tzOff) / 60))}:${pad(Math.abs(tzOff) % 60)}`;
  const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T00:00:00`;
  const weDate = WEEK[6];
  const timeMin = encodeURIComponent(localISO(WEEK[0]) + tzStr);
  const timeMax = encodeURIComponent(`${weDate.getFullYear()}-${pad(weDate.getMonth()+1)}-${pad(weDate.getDate())}T23:59:59${tzStr}`);

  try {
    const resp = await fetch(
      `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime&maxResults=50`,
      { headers: { Authorization: `Bearer ${accessToken}` } }
    );
    if (resp.status === 401) {
      accessToken = null;
      sessionStorage.removeItem(TK);
      sessionStorage.removeItem(TE);
      updateCalBtn();
      setStatus('Session expired - reconnect calendar', false);
      return;
    }
    const data = await resp.json();
    const events = (data.items || []).map(ev => ({
      title: ev.summary || 'Untitled',
      start: ev.start.dateTime || ev.start.date,
      allDay: !ev.start.dateTime
    }));
    localStorage.setItem(CK, JSON.stringify(events));
    localStorage.setItem(DK, todStr);
    setStatus(`Synced ${events.length} event${events.length !== 1 ? 's' : ''}`, false);
    return events;
  } catch(err) {
    setStatus('Calendar sync failed', false);
    try { return JSON.parse(cached || '[]'); } catch(e) { return []; }
  }
}

function eventsToCalTasks(evs) {
  if (!evs) return [];
  return evs.flatMap(ev => {
    const s = ev.start || '';
    let col = -1, time = '';
    if (ev.allDay || s.length === 10) {
      col = WEEK.findIndex(d => dateKey(d) === new Date(s + 'T00:00:00').toLocaleDateString('en-CA'));
    } else {
      const ed = new Date(s);
      if (!isNaN(ed)) {
        col = WEEK.findIndex(d => dateKey(d) === ed.toLocaleDateString('en-CA'));
        time = fmtTime(s);
      }
    }
    if (col < 0) return [];
    return [{ id: 'cal_' + Math.random().toString(36).slice(2), text: ev.title, day: col, done: false, isCal: true, time }];
  }).sort((a, b) => a.time.localeCompare(b.time));
}

function connectCalendar() {
  google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: async (resp) => {
      if (resp.error) { setStatus('Auth failed: ' + resp.error, false); return; }
      accessToken = resp.access_token;
      sessionStorage.setItem(TK, accessToken);
      sessionStorage.setItem(TE, String(Date.now() + 55 * 60 * 1000));
      updateCalBtn();
      calTasks = eventsToCalTasks(await fetchCalendar(true));
      render();
    }
  }).requestAccessToken();
}

document.getElementById('cal-btn').addEventListener('click', async () => {
  if (accessToken) {
    calTasks = eventsToCalTasks(await fetchCalendar(true));
    render();
  } else {
    connectCalendar();
  }
});

if (accessToken) {
  fetchCalendar(false).then(evs => { calTasks = eventsToCalTasks(evs); render(); });
}
// ─────────────────────────────────────────────────────────────────────────────

// ── Render ────────────────────────────────────────────────────────────────────
function allForDay(di) {
  const cal = calTasks.filter(t => t.day === di);
  let usr = tasks.filter(t => t.day === di && (!t.weekStart || t.weekStart >= weekStartKey));

  // Apply category filter (cal tasks always shown in 'all', hidden in work/personal modes)
  if (filterMode === 'work') usr = usr.filter(t => t.category === 'work');
  if (filterMode === 'personal') usr = usr.filter(t => (t.category || 'personal') === 'personal');

  // Manual order: stable sort by `order` (tasks without one sink to the bottom,
  // keeping their current array position). Sort modes below re-sort on top of this,
  // and because ties stay stable, manual order is preserved within equal groups.
  usr = usr
    .map((t, i) => [t, i])
    .sort((a, b) => {
      const oa = a[0].order, ob = b[0].order;
      if (oa == null && ob == null) return a[1] - b[1];
      if (oa == null) return 1;
      if (ob == null) return -1;
      return (oa - ob) || (a[1] - b[1]);
    })
    .map(p => p[0]);

  const combined = filterMode === 'all' ? [...cal, ...usr] : [...usr];
  if (sortMode === 'priority') {
    return combined.sort((a, b) => (isFlagged(b) ? 1 : 0) - (isFlagged(a) ? 1 : 0));
  }
  if (sortMode === 'status') return combined.sort((a, b) => a.done - b.done);
  return combined;
}

function updateProgress() {
  const current = tasks.filter(t => !t.weekStart || t.weekStart >= weekStartKey);
  const pct = current.length ? Math.round(current.filter(t => t.done).length / current.length * 100) : 0;
  document.getElementById('prog').style.width = pct + '%';
}

function render() {
  openSwipeRow = null;   // the DOM is about to be rebuilt, so nothing stays open
  const container = document.getElementById('days-container');
  container.innerHTML = '';

  WEEK.forEach((dt, di) => {
    const isToday = di === todayColIdx;
    const dayTasks = allForDay(di);
    const isOpen = collapsed[di] ?? true;
    const userTasks = tasks.filter(t => t.day === di && (!t.weekStart || t.weekStart >= weekStartKey));
    const doneCount = userTasks.filter(t => t.done).length;

    const block = document.createElement('div');
    block.className = 'day-block';

    const hrow = document.createElement('div');
    hrow.className = 'day-header-row';
    hrow.innerHTML =
      `<div>
        <div class="day-title${isToday ? ' today' : ''}">${DAY_NAMES[di]}</div>
        <div class="day-meta">${dt.toLocaleDateString('en-US', {month:'long', day:'numeric'})}</div>
      </div>
      <div class="day-header-right">
        ${userTasks.length ? `<span class="day-count">${doneCount}/${userTasks.length}</span>` : ''}
        <i class="ti ti-chevron-down chevron ${isOpen ? 'open' : ''}"></i>
      </div>`;
    hrow.addEventListener('click', () => { collapsed[di] = !isOpen; render(); });

    // Auto-expand collapsed day when dragging over its header
    hrow.addEventListener('dragenter', e => {
      if (dragId && !isOpen) {
        collapsed[di] = true; // true = open (collapsed[di]??true means true=open)
        render();
      }
    });

    block.appendChild(hrow);

    if (isOpen) {
      const body = document.createElement('div');
      body.className = 'day-body';
      body.dataset.dayIdx = di;

      body.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; body.classList.add('drag-over'); markInsertion(body, e.clientY, dragId); });
      body.addEventListener('dragleave', e => { if (!body.contains(e.relatedTarget)) { body.classList.remove('drag-over'); clearInsertion(); } });
      body.addEventListener('drop', e => {
        e.preventDefault();
        body.classList.remove('drag-over');
        clearInsertion();
        const id = dragId || e.dataTransfer.getData('text/plain');
        if (id) handleDrop(id, body, e.clientY);
        dragId = null;
      });

      dayTasks.forEach(t => {
        const row = document.createElement('div');
        const isWork = !t.isCal && t.category === 'work';
        row.className = `task-row${isWork ? ' cat-work' : ''}`;
        if (!t.isCal) row.draggable = true;
        const tid = String(t.id);
        row.dataset.taskId = tid;
        if (t.isCal) row.dataset.cal = '1';
        const isEditingThis = editingTaskId === tid;

        // Build check box
        const checkBox = document.createElement('div');
        checkBox.className = `check-box${t.done ? ' checked' : ''}${t.isCal ? ' cal' : ''}`;
        checkBox.dataset.check = tid;
        checkBox.dataset.iscal = t.isCal ? '1' : '0';
        checkBox.setAttribute('role', 'checkbox');
        checkBox.setAttribute('aria-checked', t.done);
        if (t.done) checkBox.innerHTML = '<i class="ti ti-check" style="font-size:12px;color:#fff"></i>';
        row.appendChild(checkBox);

        // Flag marker
        if (isFlagged(t)) {
          const dot = document.createElement('span');
          dot.className = 'pri-dot p-high';
          dot.setAttribute('aria-label', 'Flagged');
          row.appendChild(dot);
        }

        // Task label or inline edit input
        if (isEditingThis) {
          const input = document.createElement('input');
          input.className = 'task-edit-input';
          input.value = t.text;
          input.setAttribute('aria-label', 'Edit task');
          row.appendChild(input);

          // Focus after render
          requestAnimationFrame(() => { input.focus(); input.select(); });

          const save = () => {
            const newText = input.value.trim();
            if (newText && newText !== t.text) { t.text = newText; saveTask(t); }
            editingTaskId = null;
            render();
          };

          input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); save(); }
            if (e.key === 'Escape') { editingTaskId = null; render(); }
          });
          input.addEventListener('blur', save);
          input.addEventListener('click', e => e.stopPropagation());

          // Flag toggle, only while editing. pointerdown + preventDefault keeps
          // focus in the input so the blur handler doesn't re-render mid-tap.
          const editFlag = document.createElement('button');
          editFlag.className = 'flag-btn' + (isFlagged(t) ? ' on' : '');
          editFlag.innerHTML = '<i class="ti ti-flag"></i>';
          editFlag.setAttribute('aria-label', 'Toggle flag');
          editFlag.setAttribute('aria-pressed', String(isFlagged(t)));
          editFlag.addEventListener('pointerdown', e => {
            e.preventDefault();
            e.stopPropagation();
            t.priority = flagValue(!isFlagged(t));
            editFlag.classList.toggle('on', isFlagged(t));
            editFlag.setAttribute('aria-pressed', String(isFlagged(t)));
            saveTask(t);
          });
          row.appendChild(editFlag);
        } else {
          const label = document.createElement('span');
          label.className = `task-label${t.done ? ' done' : ''}`;
          label.textContent = t.text;

          // Double-click to edit (desktop)
          if (!t.isCal && !t.done) {
            label.addEventListener('dblclick', e => {
              e.stopPropagation();
              editingTaskId = tid;
              render();
            });
            // Long-press to edit (mobile) — only if NOT already drag-initiating
            let editPressTimer = null;
            label.addEventListener('touchstart', e => {
              editPressTimer = setTimeout(() => {
                // Only trigger edit if not in a drag context
                if (!touchDragging) {
                  editingTaskId = tid;
                  render();
                }
              }, 600);
            }, { passive: true });
            label.addEventListener('touchmove', () => { clearTimeout(editPressTimer); editPressTimer = null; });
            label.addEventListener('touchend', () => { clearTimeout(editPressTimer); editPressTimer = null; });
          }

          row.appendChild(label);
        }

        // Time badge
        if (t.time) {
          const time = document.createElement('span');
          time.className = 'task-time';
          time.textContent = t.time;
          row.appendChild(time);
        }

        // CAL badge
        if (t.isCal) {
          const badge = document.createElement('span');
          badge.className = 'cal-badge';
          badge.textContent = 'CAL';
          row.appendChild(badge);
        }

        // WORK badge
        if (isWork) {
          const badge = document.createElement('span');
          badge.className = 'work-badge';
          badge.textContent = 'WORK';
          row.appendChild(badge);
        }

        // Delete button
        if (!t.isCal) {
          const del = document.createElement('button');
          del.className = 'task-del';
          del.dataset.del = tid;
          del.setAttribute('aria-label', 'Delete');
          del.innerHTML = '<i class="ti ti-x"></i>';
          row.appendChild(del);
        }

        if (!t.isCal) {
          row.addEventListener('dragstart', e => { dragId = tid; e.dataTransfer.setData('text/plain', tid); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => row.classList.add('dragging'), 0); });
          row.addEventListener('dragend', () => { dragId = null; row.classList.remove('dragging'); });
          row.addEventListener('dragover', e => e.preventDefault());

          row.addEventListener('touchstart', e => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            touchLongPressTimer = setTimeout(() => {
              touchDragging = true;
              touchDragId = tid;
              row.classList.add('dragging');
              if (navigator.vibrate) navigator.vibrate(40);
              touchGhost = createGhost(t.text);
              moveGhost(touch.clientX, touch.clientY);
            }, LONG_PRESS_MS);
          }, { passive: true });

          row.addEventListener('touchmove', e => {
            const touch = e.touches[0];
            const dx = Math.abs(touch.clientX - touchStartX);
            const dy = Math.abs(touch.clientY - touchStartY);
            if (!touchDragging && (dx > 8 || dy > 8)) { clearTimeout(touchLongPressTimer); touchLongPressTimer = null; return; }
            if (!touchDragging) return;
            e.preventDefault();
            moveGhost(touch.clientX, touch.clientY);
            const hit = getDayBodyAtPoint(touch.clientX, touch.clientY);
            if (hit) {
              if (hit.body !== lastHighlightedBody) {
                clearHighlight();
                hit.body.classList.add('drag-over');
                lastHighlightedBody = hit.body;
                if (collapsed[hit.idx] === false) { collapsed[hit.idx] = true; render(); }
              }
              markInsertion(hit.body, touch.clientY, touchDragId);
            } else {
              clearHighlight();
              clearInsertion();
            }
          }, { passive: false });

          row.addEventListener('touchend', e => {
            clearTimeout(touchLongPressTimer);
            touchLongPressTimer = null;
            if (!touchDragging) return;
            const touch = e.changedTouches[0];
            const hit = getDayBodyAtPoint(touch.clientX, touch.clientY);
            if (hit) handleDrop(touchDragId, hit.body, touch.clientY);
            cancelTouchDrag();
          });

          row.addEventListener('touchcancel', cancelTouchDrag);

          // ── Swipe left to reveal Flag and Delete ──────────────────────────
          let swipeActive = false;   // this gesture has become a swipe
          let swipeBase = 0;         // offset the row already had when the touch began
          let swipeOffset = 0;       // current translation, tracked rather than re-parsed

          row.addEventListener('touchstart', () => {
            swipeActive = false;
            swipeBase = (openSwipeRow === row) ? -SWIPE_ACTION_W : 0;
            if (openSwipeRow && openSwipeRow !== row) closeOpenSwipe();
          }, { passive: true });

          row.addEventListener('touchmove', e => {
            if (touchDragging) return;               // a long-press drag wins outright
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (!swipeActive) {
              // Only claim the gesture if it is clearly horizontal, so vertical
              // scrolling through the week still feels normal.
              if (Math.abs(dx) < SWIPE_START_PX || Math.abs(dx) < Math.abs(dy) * 1.4) return;
              swipeActive = true;
              clearTimeout(touchLongPressTimer);
              touchLongPressTimer = null;
              row.classList.add('swiping');
            }
            e.preventDefault();
            swipeOffset = Math.max(-SWIPE_ACTION_W, Math.min(0, swipeBase + dx));
            row.style.transform = `translateX(${swipeOffset}px)`;
          }, { passive: false });

          const endSwipe = () => {
            if (!swipeActive) return;
            swipeActive = false;
            lastSwipeEnd = Date.now();
            row.classList.remove('swiping');
            const current = swipeOffset;
            if (current < -SWIPE_ACTION_W / 3) {
              row.style.transform = `translateX(${-SWIPE_ACTION_W}px)`;
              openSwipeRow = row;
              if (navigator.vibrate) navigator.vibrate(8);
            } else {
              row.style.transform = 'translateX(0)';
              if (openSwipeRow === row) openSwipeRow = null;
            }
          };
          row.addEventListener('touchend', endSwipe);
          row.addEventListener('touchcancel', endSwipe);
        }

        const swipeWrap = document.createElement('div');
        swipeWrap.className = 'task-swipe';
        if (!t.isCal) {
          const actions = document.createElement('div');
          actions.className = 'swipe-actions';

          const flagBtn = document.createElement('button');
          flagBtn.className = 'sa-flag';
          flagBtn.innerHTML = `<i class="ti ti-flag"></i>${isFlagged(t) ? 'Unflag' : 'Flag'}`;
          flagBtn.addEventListener('click', e => {
            e.stopPropagation();
            t.priority = flagValue(!isFlagged(t));
            closeOpenSwipe();
            saveTask(t);
            render();
          });

          const delBtn = document.createElement('button');
          delBtn.className = 'sa-del';
          delBtn.innerHTML = '<i class="ti ti-trash"></i>Delete';
          delBtn.addEventListener('click', e => {
            e.stopPropagation();
            closeOpenSwipe();
            removeTask(tid);
          });

          actions.appendChild(flagBtn);
          actions.appendChild(delBtn);
          swipeWrap.appendChild(actions);
        }
        swipeWrap.appendChild(row);
        body.appendChild(swipeWrap);
      });

      body.addEventListener('click', e => {
        // A swipe ends with a synthetic click; don't let it toggle a checkbox.
        if (Date.now() - lastSwipeEnd < 350) return;
        if (openSwipeRow && openSwipeRow.contains(e.target)) { closeOpenSwipe(); return; }
        const chk = e.target.closest('[data-check]');
        if (chk) {
          const id = chk.getAttribute('data-check');
          chk.classList.remove('pop');
          void chk.offsetWidth; // reflow to restart animation
          chk.classList.add('pop');
          if (chk.getAttribute('data-iscal') === '1') {
            const t = calTasks.find(x => String(x.id) === id);
            if (t) { t.done = !t.done; render(); updateProgress(); }
          } else {
            const t = tasks.find(x => String(x.id) === id);
            if (t) { t.done = !t.done; render(); saveTask(t); }
          }
          return;
        }
        const del = e.target.closest('[data-del]');
        if (del) removeTask(del.getAttribute('data-del'));
      });

      // Per-day add row with category toggle
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      let addCat = 'personal';
      let addFlag = false;
      addRow.innerHTML =
        `<input type="text" placeholder="Add a new task..." aria-label="Add task for ${DAY_NAMES[di]}" />` +
        `<button class="flag-btn add-flag" aria-label="Flag new task" aria-pressed="false"><i class="ti ti-flag"></i></button>` +
        `<div class="cat-toggle">` +
          `<button data-addcat="personal" class="sel-personal">ME</button>` +
          `<button data-addcat="work">WORK</button>` +
        `</div>` +
        `<button class="add-row-btn">+</button>`;

      const inp = addRow.querySelector('input');
      const catToggle = addRow.querySelector('.cat-toggle');
      const addFlagBtn = addRow.querySelector('.add-flag');

      addFlagBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        addFlag = !addFlag;
        addFlagBtn.classList.toggle('on', addFlag);
        addFlagBtn.setAttribute('aria-pressed', String(addFlag));
        inp.focus();
      });

      catToggle.addEventListener('click', e => {
        const btn = e.target.closest('button[data-addcat]');
        if (!btn) return;
        addCat = btn.dataset.addcat;
        catToggle.querySelectorAll('button').forEach(b => {
          b.className = b.dataset.addcat === addCat ? `sel-${addCat}` : '';
        });
      });

      const doAdd = () => {
        const txt = inp.value.trim();
        if (txt) {
          commitNewTask({id: newId(), text: txt, day: di, priority: flagValue(addFlag), done: false, category: addCat});
          addFlag = false;
          // render() rebuilt the day blocks, so re-focus the fresh add input for this day
          const reInp = document.querySelectorAll('#days-container .day-block')[di]?.querySelector('.add-row input');
          if (reInp) reInp.focus();
        }
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') doAdd(); });
      addRow.querySelector('.add-row-btn').addEventListener('click', doAdd);
      body.appendChild(addRow);
      block.appendChild(body);
    }
    container.appendChild(block);
  });

  updateProgress();
}
// ─────────────────────────────────────────────────────────────────────────────

// ── Header buttons ────────────────────────────────────────────────────────────
// Filter button cycles: All → Work → Personal → All
const filterCycle = ['all', 'work', 'personal'];
let filterIdx = Math.max(0, filterCycle.indexOf(filterMode));
const filterBtn = document.getElementById('filter-btn');
function applyFilterBtn() {
  if (filterMode === 'all') {
    filterBtn.innerHTML = '<i class="ti ti-filter"></i> All';
    filterBtn.className = 'hbtn';
  } else if (filterMode === 'work') {
    filterBtn.innerHTML = '<i class="ti ti-briefcase"></i> Work';
    filterBtn.className = 'hbtn active-work';
  } else {
    filterBtn.innerHTML = '<i class="ti ti-home"></i> Personal';
    filterBtn.className = 'hbtn active-personal';
  }
}
filterBtn.addEventListener('click', function() {
  filterIdx = (filterIdx + 1) % filterCycle.length;
  filterMode = filterCycle[filterIdx];
  localStorage.setItem(FK, filterMode);
  applyFilterBtn();
  render();
});
applyFilterBtn();

// Sort button
const sortCycle = ['none', 'priority', 'status'];
let sortIdx = Math.max(0, sortCycle.indexOf(sortMode));
const sortBtn = document.getElementById('sort-btn');
function applySortBtn() {
  sortBtn.innerHTML = sortMode === 'priority' ? '<i class="ti ti-flag"></i> Flagged'
    : sortMode === 'status' ? '<i class="ti ti-check"></i> Status'
    : '<i class="ti ti-arrow-up-down"></i> Sort';
}
sortBtn.addEventListener('click', function() {
  sortIdx = (sortIdx + 1) % sortCycle.length;
  sortMode = sortCycle[sortIdx];
  localStorage.setItem(SK, sortMode);
  applySortBtn();
  render();
});
applySortBtn();

document.getElementById('clear-btn').addEventListener('click', () => {
  tasks.filter(t => t.done && (!t.weekStart || t.weekStart >= weekStartKey)).forEach(t => removeTask(t.id));
  accountModal.style.display = 'none';
});
// ─────────────────────────────────────────────────────────────────────────────

// ── Authentication gate ───────────────────────────────────────────────────────
const authGateEl   = document.getElementById('auth-gate');
const authStatusEl  = document.getElementById('auth-status');
const signinBtn     = document.getElementById('signin-btn');
const accountBtn    = document.getElementById('account-btn');
const accountModal  = document.getElementById('account-modal');

function setAuthStatus(msg, isErr) {
  authStatusEl.textContent = msg || '';
  authStatusEl.classList.toggle('err', !!isErr);
}

signinBtn.addEventListener('click', async () => {
  signinBtn.disabled = true;
  setAuthStatus('Opening Google sign-in...', false);
  try {
    await signInWithPopup(auth, googleProvider);
    // onAuthStateChanged handles the rest on success
  } catch (e) {
    signinBtn.disabled = false;
    const code = e && e.code ? e.code : '';
    if (code === 'auth/popup-closed-by-user' || code === 'auth/cancelled-popup-request') {
      setAuthStatus('Sign-in cancelled. Try again.', true);
    } else if (code === 'auth/unauthorized-domain') {
      setAuthStatus('This domain is not authorized in Firebase Auth settings.', true);
    } else if (code === 'auth/popup-blocked') {
      setAuthStatus('Popup blocked — allow popups for this site and retry.', true);
    } else {
      setAuthStatus('Sign-in failed: ' + (code || (e && e.message) || 'unknown error'), true);
    }
    console.error('Sign-in error:', e);
  }
});

accountBtn.addEventListener('click', () => {
  const u = auth.currentUser;
  if (!u) return;
  document.getElementById('account-email').textContent = u.email || '(no email)';
  accountModal.style.display = 'flex';
});
document.getElementById('account-close-btn').addEventListener('click', () => {
  accountModal.style.display = 'none';
});
document.getElementById('signout-btn').addEventListener('click', async () => {
  accountModal.style.display = 'none';
  try { await signOut(auth); } catch (e) { console.error('Sign-out error:', e); }
});

// ── Archive history view ──────────────────────────────────────────────────────
const archiveBtn   = document.getElementById('archive-btn');
const archiveModal = document.getElementById('archive-modal');
archiveBtn.addEventListener('click', async () => {
  accountModal.style.display = 'none';
  archiveModal.style.display = 'flex';
  const listEl = document.getElementById('archive-list');
  listEl.innerHTML = '<div class="archive-empty">Loading…</div>';
  try {
    const snap = await getDocs(query(archiveCol, orderBy('archivedAt', 'desc'), limit(100)));
    if (snap.empty) {
      listEl.innerHTML = '<div class="archive-empty">No archived tasks yet.</div>';
      return;
    }
    const rows = [];
    snap.forEach(docSnap => {
      const t = docSnap.data();
      const dayLabel = (typeof t.day === 'number' && DAY_SHORT[t.day]) ? DAY_SHORT[t.day] : '';
      let dateStr = '';
      if (t.archivedAt) {
        const d = new Date(t.archivedAt);
        if (!isNaN(d.getTime())) dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }
      rows.push(
        '<div class="modal-task done"><span class="modal-day-label">' + dayLabel + '</span>' +
        '<span style="flex:1">' + escapeHtml(t.text || '') + '</span>' +
        '<span class="archive-date">' + dateStr + '</span></div>'
      );
    });
    listEl.innerHTML = rows.join('');
  } catch (e) {
    console.error('Archive load failed', e);
    listEl.innerHTML = '<div class="archive-empty">Couldn\'t load archive.</div>';
  }
});
document.getElementById('archive-close-btn').addEventListener('click', () => {
  archiveModal.style.display = 'none';
});
// ─────────────────────────────────────────────────────────────────────────────

onAuthStateChanged(auth, (user) => {
  if (user) {
    authGateEl.style.display = 'none';
    accountBtn.style.display = '';
    console.log('Firebase UID:', user.uid);
    startFirestoreSync();
  } else {
    firestoreStarted = false;
    authGateEl.style.display = 'flex';
    accountBtn.style.display = 'none';
    signinBtn.disabled = false;
    setAuthStatus('', false);
  }
});
// ─────────────────────────────────────────────────────────────────────────────

updateCalBtn();
</script>
</body>
